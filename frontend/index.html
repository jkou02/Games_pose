<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MoCap Avatar 3D</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #101319; }
      body { font-family: ui-sans-serif, system-ui, sans-serif; color: #e6ebf5; }
      #viewport { display: block; width: 100%; height: 100%; }
      .hud {
        position: fixed; left: 16px; bottom: 16px;
        display: flex; gap: 12px; align-items: center;
        padding: 8px 14px; border-radius: 999px;
        background: rgba(16, 19, 25, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        font-size: 13px; letter-spacing: 0.01em;
        backdrop-filter: blur(8px);
      }
      #status[data-state="connected"] { color: #4ade80; }
      #status[data-state="connecting"] { color: #facc15; }
      #status[data-state="error"],
      #status[data-state="disconnected"] { color: #f87171; }
      #fps { color: #94a3b8; font-variant-numeric: tabular-nums; }
      #tracking { color: #94a3b8; }
    </style>
  </head>
  <body>
    <canvas id="viewport"></canvas>
    <div class="hud">
      <span id="status" data-state="connecting">○ iniciando</span>
      <span id="tracking">sin datos</span>
      <span id="fps">0 FPS</span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
